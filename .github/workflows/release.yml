name: Release

# Publishes to crates.io when a version tag is pushed, through crates.io
# trusted publishing: the job's OIDC token is exchanged for a short-lived
# publish token, so no crates.io token is stored in the repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token trusted publishing exchanges.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check the tag names the manifest's version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} is not v${version}"; exit 1; }
      - name: Exchange the OIDC token for a publish token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
